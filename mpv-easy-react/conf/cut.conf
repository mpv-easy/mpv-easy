cut-event-name="cut"
output-event-name="output"
output-gif-event-name="output-gif"
cancel-event-name="cancel"
output-directory=""
# maxWidth <= 0 keeps the original resolution, no scaling is applied
max-width=1024
fps=24
flags="spline"
# extra ffmpeg args appended to the end of the ffmpeg command.
# cut output defaults to lossless stream copy (-c copy, no quality loss),
# extra-args can force a re-encode, e.g. more accurate cut points.
# example: lossless re-encode (also applies to gif output, adjust if needed)
# extra-args="-c:v libx264 -crf 0 -preset veryslow"