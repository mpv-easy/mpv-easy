crop-event-name="crop"
output-event-name="output"
cancel-event-name="cancel"
# ARGB
line-color="#FFFFFFFF"
mask-color="#C0000000"
line-color-hover="#FFFFFF00"
line-width=4
label-font-size=24
output-directory=""
crop-image-format="webp"
crop-zindex=2048
# extra ffmpeg args appended to the end of the ffmpeg command.
# crop video already defaults to lossless high quality
# (libx264 -crf 0 -preset veryslow); set extra-args to override it.
# example: faster, near-lossless
# extra-args="-crf 18 -preset slow"